<title id="title">02 / 发动机推力、质心与整船质量</title><desc id="desc">朝向决定推力方向，安装位置决定力矩；同一推力作用于更重的船，响应更慢。</desc>
<defs>
<marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 12 7 L 0 13 Z" fill="#66c8ff"/></marker>
