<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #cfe9f4;
    }

    body {
      display: grid;
      place-items: center;
    }

    svg {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .wheel-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin 0.95s linear infinite;
    }

    .crank-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin 0.72s linear infinite;
    }

    .bob {
      animation: bob 0.58s ease-in-out infinite;
    }

    .cloud-a {
      animation: drift 20s linear infinite;
    }

    .cloud-b {
      animation: drift 28s linear infinite reverse;
    }

    .road-line {
      animation: road-slide 1s linear infinite;
    }

    .leg-front {
      transform-origin: 570px 358px;
      animation: leg-front 0.72s ease-in-out infinite;
    }

    .leg-back {
      transform-origin: 552px 359px;
      animation: leg-back 0.72s ease-in-out infinite;
    }

    @keyframes wheel-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes bob {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes drift {
      from {
        transform: translateX(-30px);
      }
      to {
        transform: translateX(80px);
      }
    }

    @keyframes road-slide {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-140px);
      }
    }

    @keyframes leg-front {
      0%,
      100% {
        transform: rotate(19deg);
      }
      50% {
        transform: rotate(-18deg);
      }
    }

    @keyframes leg-back {
      0%,
      100% {
        transform: rotate(-17deg);
      }
      50% {
        transform: rotate(20deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-play-state: paused !important;
      }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 1200 700" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
    <title id="title">鹈鹕骑自行车</title>
    <desc id="desc">一只白色鹈鹕骑着红色自行车，在海边道路上前进。</desc>

    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#b8def0" />
        <stop offset="100%" stop-color="#eef7f7" />
      </linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#70bdd0" />
        <stop offset="100%" stop-color="#4fa5be" />
      </linearGradient>
      <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#efb344" />
        <stop offset="100%" stop-color="#f39a34" />
      </linearGradient>
      <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="5" />
      </filter>
    </defs>

    <!-- 天空 -->
    <rect width="1200" height="700" fill="url(#sky)" />
    <circle cx="1020" cy="112" r="58" fill="#ffe79b" opacity="0.9" />
    <circle cx="1020" cy="112" r="76" fill="none" stroke="#fff1b8" stroke-width="3" opacity="0.7" />

    <!-- 云 -->
    <g class="cloud-a" fill="#fff" opacity="0.8">
      <ellipse cx="190" cy="130" rx="52" ry="23" />
      <ellipse cx="235" cy="127" rx="41" ry="28" />
      <ellipse cx="154" cy="142" rx="35" ry="19" />
    </g>
    <g class="cloud-b" fill="#fff" opacity="0.65">
      <ellipse cx="765" cy="176" rx="48" ry="20" />
      <ellipse cx="807" cy="170" rx="33" ry="25" />
      <ellipse cx="728" cy="182" rx="29" ry="16" />
    </g>

    <!-- 远山和海 -->
    <path d="M0 338 L130 262 L222 320 L332 246 L443 332 L566 276 L694 334 L824 250 L952 321 L1085 259 L1200 326 L1200 420 L0 420 Z"
          fill="#94bfc0" opacity="0.58" />
    <rect x="0" y="350" width="1200" height="132" fill="url(#sea)" />
    <path d="M0 392 Q70 380 140 392 T280 392 T420 392 T560 392 T700 392 T840 392 T980 392 T1120 392 T1260 392"
          fill="none" stroke="#bde9ec" stroke-width="5" opacity="0.65" />
    <path d="M0 425 Q85 412 170 425 T340 425 T510 425 T680 425 T850 425 T1020 425 T1190 425"
          fill="none" stroke="#d8f4f2" stroke-width="3" opacity="0.55" />

    <!-- 沙滩与道路 -->
    <path d="M0 476 C230 448 370 465 575 448 C786 432 981 461 1200 438 L1200 535 L0 535 Z"
          fill="#efdda9" />
    <rect x="0" y="520" width="1200" height="180" fill="#48515b" />
    <rect x="0" y="532" width="1200" height="5" fill="#69737d" />
    <rect x="0" y="654" width="1200" height="6" fill="#373f48" />

    <!-- 移动的道路标线 -->
    <g class="road-line" fill="#f4df7a">
      <rect x="-100" y="601" width="92" height="10" rx="5" />
      <rect x="40" y="601" width="92" height="10" rx="5" />
      <rect x="180" y="601" width="92" height="10" rx="5" />
      <rect x="320" y="601" width="92" height="10" rx="5" />
      <rect x="460" y="601" width="92" height="10" rx="5" />
      <rect x="600" y="601" width="92" height="10" rx="5" />
      <rect x="740" y="601" width="92" height="10" rx="5" />
      <rect x="880" y="601" width="92" height="10" rx="5" />
      <rect x="1020" y="601" width="92" height="10" rx="5" />
      <rect x="1160" y="601" width="92" height="10" rx="5" />
      <rect x="1300" y="601" width="92" height="10" rx="5" />
    </g>

    <!-- 地面阴影 -->
    <ellipse cx="596" cy="579" rx="286" ry="26" fill="#19232d" opacity="0.26" filter="url(#softShadow)" />

    <!-- 自行车 -->
    <g id="bike">
      <!-- 后轮 -->
      <g transform="translate(395 535)">
        <g class="wheel-spin">
          <circle r="104" fill="#2f3740" />
          <circle r="91" fill="#f7fbfc" />
          <circle r="84" fill="none" stroke="#6b7882" stroke-width="3" />
          <g stroke="#7d8992" stroke-width="2">
            <line x1="-80" y1="0" x2="80" y2="0" />
            <line x1="0" y1="-80" x2="0" y2="80" />
            <line x1="-57" y1="-57" x2="57" y2="57" />
            <line x1="-57" y1="57" x2="57" y2="-57" />
            <line x1="-76" y1="-28" x2="76" y2="28" />
            <line x1="-76" y1="28" x2="76" y2="-28" />
            <line x1="-28" y1="-76" x2="28" y2="76" />
            <line x1="28" y1="-76" x2="-28" y2="76" />
          </g>
          <circle r="8" fill="#343c44" />
        </g>
      </g>

      <!-- 前轮 -->
      <g transform="translate(785 535)">
        <g class="wheel-spin">
          <circle r="104" fill="#2f3740" />
          <circle r="91" fill="#f7fbfc" />
          <circle r="84" fill="none" stroke="#6b7882" stroke-width="3" />
          <g stroke="#7d8992" stroke-width="2">
            <line x1="-80" y1="0" x2="80" y2="0" />
            <line x1="0" y1="-80" x2="0" y2="80" />
            <line x1="-57" y1="-57" x2="57" y2="57" />
            <line x1="-57" y1="57" x2="57" y2="-57" />
            <line x1="-76" y1="-28" x2="76" y2="28" />
            <line x1="-76" y1="28" x2="76" y2="-28" />
            <line x1="-28" y1="-76" x2="28" y2="76" />
            <line x1="28" y1="-76" x2="-28" y2="76" />
          </g>
          <circle r="8" fill="#343c44" />
        </g>
      </g>

      <!-- 车架 -->
      <g fill="none" stroke="#d64f43" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
        <path d="M395 535 L515 392 L590 535 Z" />
        <path d="M515 392 L690 397 L590 535 L395 535" />
        <path d="M690 397 L785 535" />
        <path d="M690 397 L728 344" />
      </g>

      <!-- 前叉与车把 -->
      <g fill="none" stroke="#39434b" stroke-width="10" stroke-linecap="round">
        <path d="M690 397 L785 535" />
        <path d="M713 360 L754 337" />
        <path d="M754 337 L786 350" />
      </g>

      <!-- 座位 -->
      <path d="M481 371 Q515 359 551 373" fill="none" stroke="#303943" stroke-width="16" stroke-linecap="round" />

      <!-- 曲柄 -->
      <g transform="translate(590 535)">
        <g class="crank-spin">
          <circle r="24" fill="#f4c04d" stroke="#343d45" stroke-width="6" />
          <line x1="-34" y1="0" x2="34" y2="0" stroke="#343d45" stroke-width="7" stroke-linecap="round" />
          <circle cx="-38" cy="0" r="6" fill="#343d45" />
          <circle cx="38" cy="0" r="6" fill="#343d45" />
        </g>
      </g>

      <!-- 链条 -->
      <path d="M566 517 C517 495 456 500 404 527 C463 543 524 548 566 550"
            fill="none" stroke="#55616a" stroke-width="4" opacity="0.75" />
    </g>

    <!-- 鹈鹕 -->
    <g class="bob" id="pelican">
      <!-- 腿 -->
      <g fill="none" stroke="#e6a23d" stroke-width="13" stroke-linecap="round">
        <g class="leg-back">
          <path d="M552 359 Q560 428 545 489 Q553 511 568 525" />
        </g>
        <g class="leg-front">
          <path d="M570 358 Q599 425 616 475 Q608 507 590 533" />
        </g>
      </g>

      <!-- 脚 -->
      <path d="M560 523 Q578 523 592 530" fill="none" stroke="#d88f31" stroke-width="10" stroke-linecap="round" />
      <path d="M582 531 Q604 530 619 536" fill="none" stroke="#d88f31" stroke-width="10" stroke-linecap="round" />

      <!-- 身体 -->
      <ellipse cx="535" cy="326" rx="99" ry="72" fill="#f7f5ee" stroke="#d9dde0" stroke-width="5" transform="rotate(7 535 326)" />
      <path d="M454 312 Q506 296 574 329 Q520 365 454 349 Q425 338 454 312 Z"
            fill="#e7e8e2" opacity="0.9" />
      <path d="M458 318 Q512 319 554 343 Q501 351 461 341" fill="none" stroke="#c7ccd0" stroke-width="4" opacity="0.8" />

      <!-- 尾羽 -->
      <path d="M445 315 L379 292 Q400 329 449 340 Z" fill="#eef0eb" stroke="#d7dcdf" stroke-width="4" />
      <path d="M443 326 L386 337 Q414 356 459 345 Z" fill="#f8f6ef" stroke="#d7dcdf" stroke-width="4" />

      <!-- 颈 -->
      <path d="M569 304 Q586 257 581 216 Q576 172 615 148 Q648 127 681 145 Q708 160 699 192 Q690 220 654 232 Q628 240 631 277 Q634 308 616 330 Z"
            fill="#faf8f0" stroke="#d8dde0" stroke-width="5" />

      <!-- 头 -->
      <ellipse cx="653" cy="162" rx="59" ry="49" fill="#fbf9f2" stroke="#d8dde0" stroke-width="5" transform="rotate(-8 653 162)" />

      <!-- 眼 -->
      <circle cx="671" cy="151" r="9" fill="#25323c" />
      <circle cx="674" cy="148" r="3" fill="#fff" />

      <!-- 长嘴 -->
      <path d="M691 163 Q798 151 887 174 Q798 187 694 184 Z"
            fill="url(#beak)" stroke="#cf8031" stroke-width="4" />
      <path d="M698 181 Q799 181 878 174 Q836 211 731 214 Q700 207 698 181 Z"
            fill="#f1b35c" stroke="#cf8031" stroke-width="4" />
      <path d="M741 193 Q800 195 849 181" fill="none" stroke="#df8f38" stroke-width="3" opacity="0.75" />

      <!-- 翼膀伸向车把 -->
      <path d="M572 310 Q624 325 670 349 Q703 363 735 350"
            fill="none" stroke="#e7e8e2" stroke-width="30" stroke-linecap="round" />
      <path d="M572 309 Q625 324 670 348 Q702 360 735 348"
            fill="none" stroke="#f8f6ef" stroke-width="20" stroke-linecap="round" />
      <path d="M731 350 Q746 347 757 352" fill="none" stroke="#d9a04a" stroke-width="9" stroke-linecap="round" />

      <!-- 胸前细节 -->
      <path d="M582 251 Q604 272 609 307" fill="none" stroke="#cfd4d7" stroke-width="4" opacity="0.7" />
    </g>

    <!-- 前景草 -->
    <g stroke="#698b59" stroke-width="5" stroke-linecap="round" opacity="0.75">
      <path d="M92 525 l-10 -30 M92 525 l14 -34 M92 525 l27 -19" />
      <path d="M1088 521 l-12 -32 M1088 521 l13 -39 M1088 521 l28 -21" />
    </g>

    <!-- 标题牌 -->
    <g transform="translate(52 52)">
      <rect x="0" y="0" width="276" height="74" rx="22" fill="#273743" opacity="0.88" />
      <text x="28" y="48" fill="#fffaf0" font-size="30" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700">
        Pelican Pedal
      </text>
    </g>
  </svg>
</body>
</html>
