<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172b36">
  <meta name="description" content="一只鹈鹕骑着自行车，沿着低饱和像素风海岸前进。">
  <title>鹈鹕上路了 · FlatWorld 田野小记</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      background: #172b36;
      color: #e6f0e8;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --ink: #e6f0e8;
      --muted: #a7c1bd;
      --edge: #405b62;
      --panel: #203943;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(16px, 4vw, 48px);
      background:
        radial-gradient(ellipse at 50% 0%, #2c4950 0%, transparent 58%),
        #172b36;
    }

    main { width: min(100%, 1080px); }

    .masthead {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 4px 18px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #8fb3aa;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(26px, 4.6vw, 42px);
      font-weight: 700;
      letter-spacing: .02em;
      line-height: 1.1;
    }

    .intro {
      max-width: 300px;
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      text-align: right;
    }

    .scene-card {
      overflow: hidden;
      border: 2px solid #48636a;
      border-radius: 4px;
      background: #223c45;
      box-shadow: 7px 7px 0 rgb(6 18 24 / 42%), 0 2px 0 rgb(211 222 199 / 8%) inset;
    }

    .artwork {
      display: block;
      width: 100%;
      height: auto;
      background: #bdc9b9;
      image-rendering: pixelated;
      shape-rendering: crispEdges;
    }

    .controls {
      display: flex;
      min-height: 70px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 20px;
      border-top: 2px solid #3d5960;
      background: #203943;
    }

    .scene-note {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .scene-note::before {
      width: 8px;
      height: 8px;
      background: #c28b55;
      box-shadow: 3px 3px 0 rgb(194 139 85 / 20%);
      content: "";
    }

    button {
      min-height: 40px;
      padding: 0 15px;
      border: 2px solid #607977;
      border-radius: 3px;
      background: #2b4a50;
      color: #edf1df;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    button:hover { border-color: #a4bca4; background: #34575a; }
    button:active { transform: translate(1px, 1px); }
    button:focus-visible { outline: 3px solid #d6b47b; outline-offset: 3px; }

    @media (max-width: 620px) {
      body { padding: 18px 12px; }
      .masthead { display: block; margin-inline: 3px; }
      .intro { margin-top: 10px; text-align: left; }
      .controls { min-height: 62px; padding: 10px 13px; }
      .scene-note { max-width: 52%; font-size: 12px; }
      .scene-card { box-shadow: 4px 4px 0 rgb(6 18 24 / 42%); }
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <div>
        <p class="eyebrow">FLATWORLD · 田野小记 01</p>
        <h1>鹈鹕上路了</h1>
      </div>
      <p class="intro">午后风软，车铃轻响。<br>它今天打算骑到海边去。</p>
    </header>

    <section class="scene-card" aria-label="鹈鹕骑自行车动画">
      <svg id="pelican-ride" class="artwork" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 62" role="img" aria-labelledby="scene-title scene-description">
        <title id="scene-title">一只鹈鹕骑着绿色自行车经过海边</title>
        <desc id="scene-description">以低饱和大色块绘制的像素风海岸。鹈鹕在骑行，车轮、曲柄、双腿、云朵和路面持续做循环动画。</desc>
        <defs>
          <clipPath id="scene-clip"><rect width="100" height="62"/></clipPath>
        </defs>

        <g clip-path="url(#scene-clip)">
          <!-- 以 100 × 62 的低逻辑分辨率和整格色块保留复古像素颗粒。 -->
          <rect width="100" height="62" fill="#bdc9b9"/>
          <rect y="0" width="100" height="25" fill="#c6cdbb"/>

          <!-- 方块太阳和云层。 -->
          <g fill="#d9bd80">
            <rect x="77" y="7" width="7" height="7"/>
            <rect x="75" y="9" width="11" height="3"/>
            <rect x="79" y="5" width="3" height="11"/>
            <rect x="73" y="9" width="2" height="2"/>
            <rect x="86" y="9" width="2" height="2"/>
          </g>
          <g class="cloud-drift" fill="#e4dfc9">
            <rect x="13" y="10" width="5" height="2"/>
            <rect x="15" y="8" width="4" height="4"/>
            <rect x="19" y="9" width="4" height="3"/>
            <rect x="24" y="11" width="3" height="1"/>
            <animateTransform attributeName="transform" type="translate" from="-30 0" to="110 0" dur="34s" repeatCount="indefinite"/>
          </g>
          <g class="cloud-drift" fill="#e4dfc9" opacity=".78">
            <rect x="62" y="17" width="5" height="2"/>
            <rect x="64" y="15" width="4" height="4"/>
            <rect x="68" y="16" width="4" height="3"/>
            <animateTransform attributeName="transform" type="translate" from="20 0" to="-100 0" dur="46s" repeatCount="indefinite"/>
          </g>

          <!-- 远山、海面和沙岸用阶梯轮廓分层。 -->
          <path d="M0 34V30H7V28H13V26H19V29H25V31H32V28H37V25H43V28H49V31H57V29H61V26H67V24H72V27H78V29H84V26H89V24H94V28H100V38H0Z" fill="#8fa79b"/>
          <path d="M0 37V35H8V33H15V32H20V34H27V36H34V33H39V30H45V32H52V35H60V33H67V31H73V33H80V36H88V33H93V31H100V41H0Z" fill="#718f86"/>
          <rect y="35" width="100" height="11" fill="#718f86"/>
          <g fill="#a9c0a8" opacity=".8">
            <rect x="4" y="38" width="10" height="1"/>
            <rect x="17" y="40" width="7" height="1"/>
            <rect x="32" y="37" width="11" height="1"/>
            <rect x="55" y="40" width="9" height="1"/>
            <rect x="73" y="38" width="12" height="1"/>
            <rect x="89" y="41" width="6" height="1"/>
          </g>
          <g class="water-drift" fill="#c2cfb1" opacity=".82">
            <rect x="-12" y="43" width="8" height="1"/>
            <rect x="2" y="43" width="8" height="1"/>
            <rect x="16" y="43" width="8" height="1"/>
            <rect x="30" y="43" width="8" height="1"/>
            <rect x="44" y="43" width="8" height="1"/>
            <rect x="58" y="43" width="8" height="1"/>
            <rect x="72" y="43" width="8" height="1"/>
            <rect x="86" y="43" width="8" height="1"/>
            <rect x="100" y="43" width="8" height="1"/>
            <animateTransform attributeName="transform" type="translate" from="0 0" to="-14 0" dur="5s" repeatCount="indefinite"/>
          </g>
          <path d="M0 46H9V45H21V46H32V44H43V45H54V46H66V45H78V46H90V44H100V51H0Z" fill="#aa8d64"/>
          <g fill="#71866f">
            <rect x="7" y="45" width="1" height="4"/>
            <rect x="10" y="46" width="1" height="3"/>
            <rect x="23" y="45" width="1" height="4"/>
            <rect x="89" y="45" width="1" height="4"/>
            <rect x="93" y="46" width="1" height="3"/>
          </g>

          <!-- 道路、方形标线和像素阴影。 -->
          <rect y="50" width="100" height="12" fill="#4b5b54"/>
          <rect y="50" width="100" height="1" fill="#66766a"/>
          <rect y="60" width="100" height="1" fill="#394941"/>
          <g class="road-drift" fill="#cfb77d">
            <rect x="-10" y="56" width="8" height="1"/>
            <rect x="10" y="56" width="8" height="1"/>
            <rect x="30" y="56" width="8" height="1"/>
            <rect x="50" y="56" width="8" height="1"/>
            <rect x="70" y="56" width="8" height="1"/>
            <rect x="90" y="56" width="8" height="1"/>
            <animateTransform attributeName="transform" type="translate" from="0 0" to="-20 0" dur="1.2s" repeatCount="indefinite"/>
          </g>
          <g fill="#354740" opacity=".55">
            <rect x="24" y="57" width="52" height="2"/>
            <rect x="29" y="59" width="41" height="1"/>
          </g>

          <!-- 自行车轮圈由阶梯轮廓组成，辐条以车轴为中心旋转。 -->
          <g transform="translate(31 50)">
            <path fill="#283e3f" fill-rule="evenodd" d="M0-9H3V-8H5V-6H7V-3H8V2H7V5H5V7H2V8H-2V7H-5V5H-7V2H-8V-2H-7V-5H-5V-7H-2V-8H0Z M0-7H2V-6H4V-4H5V2H4V4H2V6H-1V5H-3V4H-5V1H-6V-2H-5V-4H-4V-6H-2V-7H0Z"/>
            <path fill="#c9c6ae" fill-rule="evenodd" d="M0-6H2V-5H4V-3H5V2H4V4H2V5H-2V4H-4V2H-5V-2H-4V-4H-2V-5H0Z M0-5H1V-4H3V-2H4V1H3V3H1V4H-1V3H-3V1H-4V-2H-3V-3H-2V-4H0Z"/>
            <g class="wheel-spin" fill="none" stroke="#778d82" stroke-width=".35" shape-rendering="crispEdges">
              <path d="M0-5V5M-5 0H5M-4-4L4 4M-4 4L4-4"/>
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
            </g>
            <rect x="-.5" y="-.5" width="1" height="1" fill="#c28b55"/>
            <g fill="#354a45">
              <rect x="-1" y="-9" width="2" height="1"/>
              <rect x="7" y="-1" width="1" height="2"/>
              <rect x="-1" y="8" width="2" height="1"/>
              <rect x="-8" y="-1" width="1" height="2"/>
            </g>
          </g>
          <g transform="translate(69 50)">
            <path fill="#283e3f" fill-rule="evenodd" d="M0-9H3V-8H5V-6H7V-3H8V2H7V5H5V7H2V8H-2V7H-5V5H-7V2H-8V-2H-7V-5H-5V-7H-2V-8H0Z M0-7H2V-6H4V-4H5V2H4V4H2V6H-1V5H-3V4H-5V1H-6V-2H-5V-4H-4V-6H-2V-7H0Z"/>
            <path fill="#c9c6ae" fill-rule="evenodd" d="M0-6H2V-5H4V-3H5V2H4V4H2V5H-2V4H-4V2H-5V-2H-4V-4H-2V-5H0Z M0-5H1V-4H3V-2H4V1H3V3H1V4H-1V3H-3V1H-4V-2H-3V-3H-2V-4H0Z"/>
            <g class="wheel-spin" fill="none" stroke="#778d82" stroke-width=".35" shape-rendering="crispEdges">
              <path d="M0-5V5M-5 0H5M-4-4L4 4M-4 4L4-4"/>
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
            </g>
            <rect x="-.5" y="-.5" width="1" height="1" fill="#c28b55"/>
            <g fill="#354a45">
              <rect x="-1" y="-9" width="2" height="1"/>
              <rect x="7" y="-1" width="1" height="2"/>
              <rect x="-1" y="8" width="2" height="1"/>
              <rect x="-8" y="-1" width="1" height="2"/>
            </g>
          </g>

          <!-- 后腿交替踏动；分帧动作保持低分辨率的像素节奏。 -->
          <path fill="none" stroke="#8f6049" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter" d="M42 34L45 38L45 44L48 52">
            <animate attributeName="d" calcMode="discrete" dur="1.2s" repeatCount="indefinite" values="M42 34L45 38L45 44L48 52;M42 34L46 38L49 43L52 48;M42 34L48 38L51 44L52 52;M42 34L46 39L45 45L48 48;M42 34L45 38L45 44L48 52"/>
          </path>

          <!-- 车架使用少量深绿和浅绿，保留旧式单车的清楚结构。 -->
          <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M31 50L43 39L50 50L31 50M43 39H60L50 50M60 39L69 50M60 39L58 43" stroke="#283e3f" stroke-width="1.5"/>
            <path d="M31 50L43 39L50 50L31 50M43 39H60L50 50M60 39L69 50M60 39L58 43" stroke="#66806a" stroke-width=".6"/>
            <path d="M43 39V37M40 37H45" stroke="#283e3f" stroke-width="1.1"/>
            <path d="M58 40V34M57 34H62" stroke="#283e3f" stroke-width="1.1"/>
            <path d="M66 46L68 48M32 48L34 46" stroke="#c9c6ae" stroke-width=".5"/>
          </g>
          <g transform="translate(50 50)">
            <g class="crank-spin" fill="none" stroke="#283e3f" stroke-width=".8" stroke-linecap="square">
              <path d="M0 0L2-2M0 0L-2 2"/>
              <rect x="1" y="-3" width="2" height="1" fill="#c28b55" stroke="none"/>
              <rect x="-3" y="2" width="2" height="1" fill="#c28b55" stroke="none"/>
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
            </g>
          </g>
          <rect x="49.5" y="49.5" width="1" height="1" fill="#c28b55"/>

          <!-- 前腿与躯干随曲柄循环，羽翼只做轻微摆动。 -->
          <path fill="none" stroke="#b96748" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter" d="M43 34L47 38L49 43L52 48">
            <animate attributeName="d" calcMode="discrete" dur="1.2s" repeatCount="indefinite" values="M43 34L47 38L49 43L52 48;M43 34L48 38L51 44L52 52;M43 34L49 39L50 45L48 52;M43 34L47 39L45 44L48 48;M43 34L47 38L49 43L52 48"/>
          </path>
          <g class="rider-bob">
            <animateTransform attributeName="transform" type="translate" values="0 0;0 -.3;0 0;0 .2;0 0" keyTimes="0;.25;.5;.75;1" dur="1.2s" repeatCount="indefinite"/>
            <path d="M34 30H36V28H38V27H41V26H45V27H47V29H48V33H46V35H43V36H38V35H35V33H33V31H34Z" fill="#dedbc7" stroke="#394d49" stroke-width=".6" stroke-linejoin="miter"/>
            <path d="M35 32H38V33H42V34H46V35H43V36H38V35H35Z" fill="#b5b7a2"/>
            <g class="wing-flap">
              <path d="M36 29H39V28H42V29H45V31H43V32H41V34H38V33H36Z" fill="#a9b8aa"/>
              <path d="M37 30H40V31H38V32H37ZM40 29H43V30H41Z" fill="#748b7b"/>
              <animateTransform attributeName="transform" type="rotate" values="0 41 31;-3 41 31;0 41 31;2 41 31;0 41 31" keyTimes="0;.25;.5;.75;1" dur="1.2s" repeatCount="indefinite"/>
            </g>
            <path d="M42 30V27H43V24H45V22H48V24H47V27H45V31Z" fill="#d7d5c1" stroke="#394d49" stroke-width=".5" stroke-linejoin="miter"/>
            <path d="M46 17H48V16H51V17H53V19H52V21H50V22H47V21H45V19H46Z" fill="#e1ddc8" stroke="#394d49" stroke-width=".55" stroke-linejoin="miter"/>
            <path d="M52 18H55V19H63V20H67V21H65V22H56V21H52Z" fill="#c89455" stroke="#394d49" stroke-width=".5" stroke-linejoin="miter"/>
            <path d="M53 20H63V22H62V24H60V26H58V25H56V23H54V22H52V21H53Z" fill="#b96748" stroke="#394d49" stroke-width=".5" stroke-linejoin="miter"/>
            <path d="M55 21H61V22H59V23H57Z" fill="#d79065"/>
            <rect x="48" y="18" width="1" height="1" fill="#263a3e"/>
            <rect x="49" y="18" width="1" height="1" fill="#f2e9d2"/>
            <path d="M45 27H48V28H51V30H54V34H57" fill="none" stroke="#c8c7b2" stroke-width=".8" stroke-linecap="square" stroke-linejoin="miter"/>
            <rect x="56" y="33" width="2" height="1" fill="#b96748"/>
            <path d="M54 19H60" fill="none" stroke="#e0c17f" stroke-width=".35"/>
          </g>
        </g>
      </svg>

      <footer class="controls">
        <span class="scene-note" id="motion-status" aria-live="polite">海风正好，慢慢骑</span>
        <button id="motion-toggle" type="button" aria-pressed="false">暂停动画</button>
      </footer>
    </section>
  </main>

  <script>
    const scene = document.getElementById("pelican-ride");
    const toggle = document.getElementById("motion-toggle");
    const status = document.getElementById("motion-status");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let paused = reducedMotion.matches;

    function updateMotion() {
      if (paused) scene.pauseAnimations();
      else scene.unpauseAnimations();
      toggle.textContent = paused ? "开始动画" : "暂停动画";
      toggle.setAttribute("aria-pressed", String(paused));
      status.textContent = paused ? "动画已停在原地" : "海风正好，慢慢骑";
    }

    toggle.addEventListener("click", () => {
      paused = !paused;
      updateMotion();
    });

    reducedMotion.addEventListener("change", event => {
      if (event.matches) paused = true;
      updateMotion();
    });

    updateMotion();
  </script>
</body>
</html>
