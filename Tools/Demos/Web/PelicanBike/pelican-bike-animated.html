<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>动态鹈鹕骑自行车 SVG</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #b9dce9;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 420px;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .toggle {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 2;
      border: 1px solid rgb(255 255 255 / 45%);
      border-radius: 999px;
      padding: 10px 16px;
      color: #f7f4e8;
      background: rgb(28 39 47 / 78%);
      box-shadow: 0 8px 28px rgb(0 0 0 / 16%);
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    .toggle:hover {
      background: rgb(28 39 47 / 90%);
    }

    .toggle:focus-visible {
      outline: 3px solid #f2c45f;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .toggle {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <svg
      id="pelicanScene"
      viewBox="0 0 1200 700"
      preserveAspectRatio="xMidYMid slice"
      role="img"
      aria-labelledby="sceneTitle sceneDescription"
      xmlns="http://www.w3.org/2000/svg">
      <title id="sceneTitle">一只鹈鹕正在骑自行车</title>
      <desc id="sceneDescription">
        鹈鹕在海边公路上骑红色自行车，车轮、踏板、双腿、翅膀、身体、云朵和路面都带有循环动画。
      </desc>

      <defs>
        <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9fd5eb" />
          <stop offset="1" stop-color="#edf6f2" />
        </linearGradient>

        <linearGradient id="seaGradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#79c4d4" />
          <stop offset="1" stop-color="#459eb7" />
        </linearGradient>

        <linearGradient id="beakGradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#f2bb4f" />
          <stop offset="1" stop-color="#eb8e34" />
        </linearGradient>

        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="#fff6c4" stop-opacity="0.95" />
          <stop offset="0.55" stop-color="#ffe48a" stop-opacity="0.65" />
          <stop offset="1" stop-color="#ffe48a" stop-opacity="0" />
        </radialGradient>

        <filter id="softShadow" x="-40%" y="-100%" width="180%" height="300%">
          <feGaussianBlur stdDeviation="9" />
        </filter>

        <filter id="tinyShadow" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18" />
        </filter>
      </defs>

      <!-- 天空 -->
      <rect width="1200" height="700" fill="url(#skyGradient)" />
      <circle cx="1022" cy="108" r="105" fill="url(#sunGlow)" />
      <circle cx="1022" cy="108" r="45" fill="#ffe89c" opacity="0.96" />

      <!-- 云层 -->
      <g fill="#ffffff" opacity="0.78">
        <g>
          <ellipse cx="146" cy="126" rx="54" ry="23" />
          <ellipse cx="195" cy="122" rx="42" ry="31" />
          <ellipse cx="229" cy="134" rx="38" ry="20" />
          <animateTransform
            attributeName="transform"
            type="translate"
            values="-90 0; 1280 0"
            dur="32s"
            repeatCount="indefinite" />
        </g>
        <g opacity="0.72">
          <ellipse cx="620" cy="182" rx="48" ry="19" />
          <ellipse cx="658" cy="176" rx="32" ry="25" />
          <ellipse cx="690" cy="185" rx="35" ry="17" />
          <animateTransform
            attributeName="transform"
            type="translate"
            values="690 0; -780 0"
            dur="42s"
            repeatCount="indefinite" />
        </g>
      </g>

      <!-- 远景 -->
      <path
        d="M0 344 L116 284 L192 325 L306 247 L404 325 L505 280 L606 331 L741 247 L842 321 L951 273 L1072 327 L1200 265 L1200 430 L0 430 Z"
        fill="#83aeb0"
        opacity="0.55" />
      <rect x="0" y="365" width="1200" height="126" fill="url(#seaGradient)" />
      <path
        d="M-80 410 Q-10 397 60 410 T200 410 T340 410 T480 410 T620 410 T760 410 T900 410 T1040 410 T1180 410 T1320 410"
        fill="none"
        stroke="#c7edf0"
        stroke-width="5"
        opacity="0.62">
        <animateTransform
          attributeName="transform"
          type="translate"
          values="0 0; -140 0"
          dur="4s"
          repeatCount="indefinite" />
      </path>

      <!-- 沙滩与公路 -->
      <path
        d="M0 478 C164 452 341 469 521 450 C735 429 942 461 1200 441 L1200 540 L0 540 Z"
        fill="#ead9a7" />
      <rect x="0" y="522" width="1200" height="178" fill="#424c55" />
      <rect x="0" y="535" width="1200" height="5" fill="#6e7981" />
      <rect x="0" y="659" width="1200" height="7" fill="#333b42" />

      <!-- 让路面向后运动，形成前进感 -->
      <g fill="#f3d66d">
        <g>
          <rect x="-160" y="606" width="100" height="10" rx="5" />
          <rect x="20" y="606" width="100" height="10" rx="5" />
          <rect x="200" y="606" width="100" height="10" rx="5" />
          <rect x="380" y="606" width="100" height="10" rx="5" />
          <rect x="560" y="606" width="100" height="10" rx="5" />
          <rect x="740" y="606" width="100" height="10" rx="5" />
          <rect x="920" y="606" width="100" height="10" rx="5" />
          <rect x="1100" y="606" width="100" height="10" rx="5" />
          <rect x="1280" y="606" width="100" height="10" rx="5" />
          <animateTransform
            attributeName="transform"
            type="translate"
            values="0 0; -180 0"
            dur="0.82s"
            repeatCount="indefinite" />
        </g>
      </g>

      <ellipse
        cx="600"
        cy="594"
        rx="302"
        ry="28"
        fill="#18232b"
        opacity="0.24"
        filter="url(#softShadow)" />

      <!-- 自行车 -->
      <g id="bike" filter="url(#tinyShadow)">
        <!-- 后轮 -->
        <g transform="translate(396 534)">
          <g>
            <circle r="104" fill="#273139" />
            <circle r="92" fill="#f8fbfa" />
            <circle r="84" fill="none" stroke="#72808a" stroke-width="3" />
            <g stroke="#7f8d96" stroke-width="2">
              <line x1="-80" y1="0" x2="80" y2="0" />
              <line x1="0" y1="-80" x2="0" y2="80" />
              <line x1="-57" y1="-57" x2="57" y2="57" />
              <line x1="-57" y1="57" x2="57" y2="-57" />
              <line x1="-75" y1="-31" x2="75" y2="31" />
              <line x1="-75" y1="31" x2="75" y2="-31" />
              <line x1="-31" y1="-75" x2="31" y2="75" />
              <line x1="31" y1="-75" x2="-31" y2="75" />
            </g>
            <circle r="8" fill="#303a42" />
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0"
              to="360"
              dur="0.82s"
              repeatCount="indefinite" />
          </g>
        </g>

        <!-- 前轮 -->
        <g transform="translate(792 534)">
          <g>
            <circle r="104" fill="#273139" />
            <circle r="92" fill="#f8fbfa" />
            <circle r="84" fill="none" stroke="#72808a" stroke-width="3" />
            <g stroke="#7f8d96" stroke-width="2">
              <line x1="-80" y1="0" x2="80" y2="0" />
              <line x1="0" y1="-80" x2="0" y2="80" />
              <line x1="-57" y1="-57" x2="57" y2="57" />
              <line x1="-57" y1="57" x2="57" y2="-57" />
              <line x1="-75" y1="-31" x2="75" y2="31" />
              <line x1="-75" y1="31" x2="75" y2="-31" />
              <line x1="-31" y1="-75" x2="31" y2="75" />
              <line x1="31" y1="-75" x2="-31" y2="75" />
            </g>
            <circle r="8" fill="#303a42" />
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0"
              to="360"
              dur="0.82s"
              repeatCount="indefinite" />
          </g>
        </g>

        <!-- 车架 -->
        <g
          fill="none"
          stroke="#d34e46"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M396 534 L516 393 L594 534 Z" />
          <path d="M516 393 L694 398 L594 534 L396 534" />
          <path d="M694 398 L792 534" />
        </g>

        <!-- 前叉、车把 -->
        <g fill="none" stroke="#333e46" stroke-width="10" stroke-linecap="round">
          <path d="M694 398 L792 534" />
          <path d="M694 398 L731 346 L770 335" />
          <path d="M770 335 L802 349" />
        </g>

        <!-- 座位 -->
        <path
          d="M482 372 Q520 359 555 374"
          fill="none"
          stroke="#2f3941"
          stroke-width="16"
          stroke-linecap="round" />

        <!-- 链条 -->
        <path
          d="M566 516 C511 494 451 501 402 527 C455 545 518 549 568 551"
          fill="none"
          stroke="#52606a"
          stroke-width="4" />

        <!-- 曲柄与踏板 -->
        <g transform="translate(594 534)">
          <g>
            <circle r="24" fill="#efbb4e" stroke="#343e46" stroke-width="6" />
            <line x1="-39" y1="0" x2="39" y2="0" stroke="#343e46" stroke-width="7" stroke-linecap="round" />
            <rect x="-54" y="-5" width="22" height="10" rx="5" fill="#29343c" />
            <rect x="32" y="-5" width="22" height="10" rx="5" fill="#29343c" />
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0"
              to="360"
              dur="0.82s"
              repeatCount="indefinite" />
          </g>
        </g>
      </g>

      <!-- 鹈鹕整体轻微上下起伏 -->
      <g id="pelican">
        <animateTransform
          attributeName="transform"
          type="translate"
          values="0 0; 0 -6; 0 0"
          dur="0.82s"
          repeatCount="indefinite" />

        <!-- 后腿：围绕髋部转动 -->
        <g transform="translate(548 356)">
          <g>
            <path
              d="M0 0 Q7 61 -7 128 Q-3 151 20 171"
              fill="none"
              stroke="#e3a03c"
              stroke-width="13"
              stroke-linecap="round" />
            <path
              d="M18 170 Q35 169 49 176"
              fill="none"
              stroke="#d68d31"
              stroke-width="10"
              stroke-linecap="round" />
            <animateTransform
              attributeName="transform"
              type="rotate"
              values="-18; 24; -18"
              dur="0.82s"
              repeatCount="indefinite" />
          </g>
        </g>

        <!-- 前腿，与后腿反相 -->
        <g transform="translate(572 356)">
          <g>
            <path
              d="M0 0 Q29 64 43 119 Q35 150 17 177"
              fill="none"
              stroke="#eba943"
              stroke-width="13"
              stroke-linecap="round" />
            <path
              d="M15 176 Q37 175 54 181"
              fill="none"
              stroke="#d68d31"
              stroke-width="10"
              stroke-linecap="round" />
            <animateTransform
              attributeName="transform"
              type="rotate"
              values="23; -17; 23"
              dur="0.82s"
              repeatCount="indefinite" />
          </g>
        </g>

        <!-- 尾羽 -->
        <path
          d="M446 314 L379 289 Q397 326 449 339 Z"
          fill="#eef0ea"
          stroke="#d6dbdc"
          stroke-width="4" />
        <path
          d="M444 326 L385 338 Q413 357 458 345 Z"
          fill="#f8f5ed"
          stroke="#d6dbdc"
          stroke-width="4" />

        <!-- 身体 -->
        <ellipse
          cx="535"
          cy="326"
          rx="100"
          ry="73"
          fill="#faf8f0"
          stroke="#d6dcde"
          stroke-width="5"
          transform="rotate(7 535 326)" />

        <!-- 收拢的远侧翼 -->
        <path
          d="M452 310 Q502 297 574 328 Q521 367 452 349 Q424 336 452 310 Z"
          fill="#e6e8e2" />
        <path
          d="M459 319 Q510 318 555 342 Q508 354 461 342"
          fill="none"
          stroke="#c4cbce"
          stroke-width="4" />

        <!-- 颈部 -->
        <path
          d="M568 305 Q589 260 582 214 Q577 171 616 147 Q649 126 682 144 Q710 159 700 191 Q691 219 654 232 Q628 240 632 278 Q636 309 615 332 Z"
          fill="#fbf9f1"
          stroke="#d6dcde"
          stroke-width="5" />

        <!-- 头部轻微点头 -->
        <g transform="translate(653 162)">
          <g>
            <ellipse
              cx="0"
              cy="0"
              rx="59"
              ry="49"
              fill="#fcfaf3"
              stroke="#d6dcde"
              stroke-width="5"
              transform="rotate(-8)" />

            <!-- 眼睛偶尔眨眼 -->
            <ellipse cx="18" cy="-11" rx="9" ry="9" fill="#25323b">
              <animate
                attributeName="ry"
                values="9;9;1;9;9"
                keyTimes="0;0.43;0.46;0.49;1"
                dur="4.6s"
                repeatCount="indefinite" />
            </ellipse>
            <circle cx="21" cy="-14" r="3" fill="#ffffff" />

            <!-- 上嘴 -->
            <path
              d="M38 1 Q145 -11 234 12 Q145 25 41 22 Z"
              fill="url(#beakGradient)"
              stroke="#c97d31"
              stroke-width="4" />

            <!-- 下嘴轻微张合 -->
            <g transform="translate(43 19)">
              <path
                d="M0 0 Q100 1 180 -7 Q136 31 33 32 Q2 25 0 0 Z"
                fill="#f1b45e"
                stroke="#c97d31"
                stroke-width="4" />
              <path
                d="M42 12 Q100 14 151 1"
                fill="none"
                stroke="#dc8d38"
                stroke-width="3"
                opacity="0.75" />
              <animateTransform
                attributeName="transform"
                type="rotate"
                values="0; 4; 0"
                dur="1.64s"
                repeatCount="indefinite" />
            </g>

            <animateTransform
              attributeName="transform"
              type="rotate"
              values="-1; 2; -1"
              dur="0.82s"
              repeatCount="indefinite" />
          </g>
        </g>

        <!-- 前侧翅膀抓住车把，并随踩踏摆动 -->
        <g transform="translate(571 310)">
          <g>
            <path
              d="M0 0 Q53 15 100 39 Q132 53 166 40"
              fill="none"
              stroke="#e4e6df"
              stroke-width="31"
              stroke-linecap="round" />
            <path
              d="M1 -1 Q54 14 100 38 Q132 50 166 38"
              fill="none"
              stroke="#faf7ef"
              stroke-width="20"
              stroke-linecap="round" />
            <path
              d="M161 40 Q177 37 188 42"
              fill="none"
              stroke="#dda047"
              stroke-width="9"
              stroke-linecap="round" />
            <animateTransform
              attributeName="transform"
              type="rotate"
              values="-2; 3; -2"
              dur="0.82s"
              repeatCount="indefinite" />
          </g>
        </g>

        <!-- 胸羽细节 -->
        <path
          d="M582 252 Q604 273 610 307"
          fill="none"
          stroke="#cbd1d3"
          stroke-width="4"
          opacity="0.7" />
      </g>

      <!-- 前景植物 -->
      <g stroke="#668657" stroke-width="5" stroke-linecap="round" opacity="0.76">
        <path d="M90 526 l-10 -31 M90 526 l15 -35 M90 526 l27 -20" />
        <path d="M1095 524 l-13 -34 M1095 524 l14 -40 M1095 524 l29 -22" />
      </g>

      <!-- 标牌 -->
      <g transform="translate(46 44)" filter="url(#tinyShadow)">
        <rect width="322" height="78" rx="23" fill="#283943" opacity="0.9" />
        <text
          x="26"
          y="36"
          fill="#f8f5e8"
          font-size="27"
          font-weight="750"
          letter-spacing="0.5">
          Pelican Pedal
        </text>
        <text
          x="27"
          y="59"
          fill="#e8c46d"
          font-size="14"
          font-weight="650"
          letter-spacing="1.6">
          SVG MOTION STUDY
        </text>
      </g>
    </svg>

    <button id="toggleAnimation" class="toggle" type="button" aria-pressed="false">
      暂停动画
    </button>
  </main>

  <script>
    (() => {
      const svg = document.getElementById("pelicanScene");
      const button = document.getElementById("toggleAnimation");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let paused = false;

      const renderState = () => {
        button.textContent = paused ? "继续动画" : "暂停动画";
        button.setAttribute("aria-pressed", String(paused));
      };

      const setPaused = (nextPaused) => {
        paused = nextPaused;
        if (paused) {
          svg.pauseAnimations();
        } else {
          svg.unpauseAnimations();
        }
        renderState();
      };

      button.addEventListener("click", () => setPaused(!paused));

      window.addEventListener("keydown", (event) => {
        if (event.code !== "Space" || event.target === button) {
          return;
        }

        event.preventDefault();
        setPaused(!paused);
      });

      if (reduceMotion.matches) {
        setPaused(true);
      } else {
        renderState();
      }
    })();
  </script>
</body>
</html>
