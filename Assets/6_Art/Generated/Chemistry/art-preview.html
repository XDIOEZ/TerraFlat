<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FlatWorld 化工物品美术总览</title>
  <style>
    :root { --preview-size: 128px; --bg: #11151b; --panel: #1c222c; --line: #313b49; --text: #eff3f7; --muted: #a8b5c6; --accent: #87daca; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--bg); font: 15px/1.6 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; }
    button, input { font: inherit; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    [hidden] { display: none !important; }
    main { max-width: 1380px; padding: 34px 24px 54px; margin: auto; }
    .eyebrow { color: var(--accent); font-size: 12px; letter-spacing: .1em; margin: 0 0 8px; }
    h1 { font-size: clamp(25px, 4vw, 36px); line-height: 1.3; margin: 0 0 12px; }
    h1 span { display: inline-block; margin-left: 10px; font-size: 16px; color: var(--accent); vertical-align: middle; }
    .intro { color: var(--muted); margin: 0 0 24px; max-width: 830px; }
    .controls { position: sticky; z-index: 2; top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; padding: 16px 18px; background: #1c222cf5; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px #0004; }
    .search { flex: 1 1 260px; }
    .search input { width: 100%; color: var(--text); background: #111820; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
    .size-control, .zoom-control { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    input[type="range"] { accent-color: var(--accent); cursor: pointer; }
    .size-control output, .zoom-control output { min-width: 47px; color: var(--accent); font-variant-numeric: tabular-nums; }
    .results { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .art-group { margin-top: 32px; }
    h2 { display: flex; align-items: center; gap: 12px; font-size: 19px; margin: 0 0 14px; }
    .group-count { font-size: 12px; color: var(--muted); font-weight: 400; border: 1px solid var(--line); border-radius: 20px; padding: 1px 9px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--preview-size) + 44px), 1fr)); gap: 14px; }
    .item-card { width: 100%; color: var(--text); text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--panel); transition: border-color .15s, background .15s; }
    .item-card:hover { border-color: var(--accent); background: #232d38; }
    .checker { background-color: #252c35; background-image: linear-gradient(45deg, #303944 25%, transparent 25%), linear-gradient(-45deg, #303944 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #303944 75%), linear-gradient(-45deg, transparent 75%, #303944 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0; }
    .canvas { display: grid; place-items: center; height: calc(var(--preview-size) + 24px); overflow: hidden; border-radius: 7px; }
    .canvas img { width: var(--preview-size); height: var(--preview-size); object-fit: contain; image-rendering: pixelated; }
    .missing { color: #bfc8d1; font-size: 13px; }
    .item-name { display: block; margin: 10px 2px 2px; font-weight: 600; }
    .item-id { display: block; margin: 0 2px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .empty { text-align: center; color: var(--muted); padding: 64px 20px; }
    .footer-note { color: var(--muted); border-top: 1px solid var(--line); padding-top: 20px; margin: 32px 0 0; font-size: 13px; }
    dialog { width: min(1100px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); margin: auto; padding: 0; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 15px; box-shadow: 0 16px 60px #0008; overflow: auto; }
    dialog::backdrop { background: #05090ddd; }
    .dialog-head { display: flex; align-items: flex-start; gap: 18px; padding: 20px; }
    .dialog-title { flex: 1; }
    .dialog-title h2 { margin: 0 0 4px; }
    .dialog-title p { margin: 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .close { padding: 4px 12px; border: 1px solid var(--line); border-radius: 7px; color: var(--text); background: transparent; }
    .dialog-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; padding: 0 20px 18px; }
    .dialog-controls a { color: var(--accent); text-decoration: none; }
    .dialog-controls a:hover { text-decoration: underline; }
    .original { color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; }
    .image-stage { min-height: 240px; max-height: 65dvh; overflow: auto; padding: 24px; display: grid; justify-items: start; }
    .image-stage img { display: block; max-width: none; max-height: none; image-rendering: pixelated; margin: auto; }
    .dialog-note { margin: 0; color: var(--muted); padding: 14px 20px; font-size: 12px; }
    @media (max-width: 580px) { main { padding: 24px 16px 36px; } .controls { top: 6px; gap: 12px; padding: 12px; } .size-control { flex: 1; } .size-control input { min-width: 60px; width: 100%; } .results { font-size: 12px; } .grid { gap: 10px; } .dialog-controls { gap: 12px; } .zoom-control input { width: 120px; } }
    @media (prefers-reduced-motion: reduce) { .item-card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">FLATWORLD · 美术预览</p>
      <h1>化工物品美术总览<span>26 款</span></h1>

          <span class="checker canvas"><img src="GasCompressor_Electric/GasCompressor_Electric_Idle.png" alt="电力气体压缩机"><span class="missing" hidden>图片暂未加载</span></span>

        </button>
        <button class="item-card" type="button" data-id="ElectricHeater" data-name="电热器" data-src="ElectricHeater/ElectricHeater_Idle.png" aria-label="查看电热器原图">
          <span class="checker canvas"><img src="ElectricHeater/ElectricHeater_Idle.png" alt="电热器"><span class="missing" hidden>图片暂未加载</span></span>
          <span class="item-name">电热器</span>

        <button class="item-card" type="button" data-id="FluidFilter" data-name="过滤器" data-src="FluidFilter/FluidFilter_Idle.png" aria-label="查看过滤器原图">

  </main>
  <dialog id="viewer" aria-labelledby="viewer-name">
    <div class="dialog-head">
      <div class="dialog-title"><h2 id="viewer-name"></h2><p id="viewer-info"></p></div>
      <button class="close" id="close" type="button" aria-label="关闭原图预览">关闭</button>
    </div>
    <div class="dialog-controls">
      <label class="zoom-control" for="zoom">缩放<input id="zoom" type="range" min="50" max="800" step="25" value="100"><output id="zoom-value" for="zoom">100%</output></label>
      <button class="original" id="original" type="button">原尺寸</button>
      <a id="original-link" target="_blank" rel="noopener">打开 PNG 原图 ↗</a>
    </div>
    <div class="checker image-stage" id="image-stage"><img id="viewer-image" alt=""><span id="viewer-missing" class="missing" hidden>图片暂未加载，请稍后重新打开。</span></div>
    <p class="dialog-note">100% 为图片原尺寸；放大后可滚动查看细节。按 Esc 关闭。</p>
  </dialog>
  <script>
    // 所有预览直接读取同目录 PNG，筛选与缩放无需联网。
    const cards = Array.from(document.querySelectorAll(".item-card"));
    const groups = Array.from(document.querySelectorAll(".art-group"));
    const search = document.getElementById("search");
    const size = document.getElementById("size");
    const viewer = document.getElementById("viewer");
    const viewerImage = document.getElementById("viewer-image");
    const viewerMissing = document.getElementById("viewer-missing");
    const zoom = document.getElementById("zoom");
    const imageStage = document.getElementById("image-stage");
    let currentCard = null;

    function filterItems() {
      const term = search.value.trim().toLocaleLowerCase();
      let shown = 0;
      cards.forEach(card => {
        const match = (card.dataset.name + " " + card.dataset.id).toLocaleLowerCase().includes(term);
        card.hidden = !match;
        if (match) shown++;
      });
      groups.forEach(group => {
        const visible = Array.from(group.querySelectorAll(".item-card")).filter(card => !card.hidden).length;
        group.hidden = visible === 0;
        group.querySelector(".group-count").textContent = visible + " 款";
      });
      document.getElementById("results").textContent = "显示 " + shown + " / 26 款";
      document.getElementById("empty").hidden = shown !== 0;
    }

    function setPreviewSize() {
      document.documentElement.style.setProperty("--preview-size", size.value + "px");
      document.getElementById("size-value").value = size.value + " px";
    }

    function setZoom() {
      document.getElementById("zoom-value").value = zoom.value + "%";
      if (viewerImage.naturalWidth) {
        viewerImage.style.width = Math.round(viewerImage.naturalWidth * Number(zoom.value) / 100) + "px";
      }
    }

    function openItem(card) {
      currentCard = card;
      document.getElementById("viewer-name").textContent = card.dataset.name;
      document.getElementById("viewer-info").textContent = card.dataset.id;
      document.getElementById("original-link").href = card.dataset.src;
      viewerMissing.hidden = true;
      viewerImage.hidden = false;
      viewerImage.style.width = "";
      viewerImage.alt = card.dataset.name;
      zoom.value = 100;
      document.getElementById("zoom-value").value = "100%";
      viewerImage.src = card.dataset.src;
      viewer.showModal();
      imageStage.scrollTo(0, 0);
      if (viewerImage.complete && viewerImage.naturalWidth) setZoom();
    }

    cards.forEach(card => {
      const image = card.querySelector("img");
      const missing = card.querySelector(".missing");
      image.addEventListener("error", () => { image.hidden = true; missing.hidden = false; });
      image.addEventListener("load", () => { image.hidden = false; missing.hidden = true; });
      if (image.complete && image.naturalWidth === 0) { image.hidden = true; missing.hidden = false; }
      card.addEventListener("click", () => openItem(card));
    });
    viewerImage.addEventListener("load", () => {
      viewerImage.hidden = false;
      viewerMissing.hidden = true;
      document.getElementById("viewer-info").textContent = currentCard.dataset.id + " · " + viewerImage.naturalWidth + " × " + viewerImage.naturalHeight + " px";
      setZoom();
    });
    viewerImage.addEventListener("error", () => { viewerImage.hidden = true; viewerMissing.hidden = false; });
    search.addEventListener("input", filterItems);
    size.addEventListener("input", setPreviewSize);
    zoom.addEventListener("input", setZoom);
    document.getElementById("original").addEventListener("click", () => { zoom.value = 100; setZoom(); imageStage.scrollTo(0, 0); });
    document.getElementById("close").addEventListener("click", () => viewer.close());
    viewer.addEventListener("click", event => { if (event.target === viewer) { const rect = viewer.getBoundingClientRect(); if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) viewer.close(); } });
  </script>
</body>
</html>
