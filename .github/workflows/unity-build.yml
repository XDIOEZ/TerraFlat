name: Unity 手动构建

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: 选择要生成的安装包
        required: true
        default: StandaloneWindows64
        type: choice
        options:
          - StandaloneWindows64
          - Android

permissions:
  contents: read

concurrency:
  group: unity-manual-build
  cancel-in-progress: false

jobs:
  build:
    name: 构建 ${{ inputs.target_platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出项目
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 检查 Unity 许可证配置
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 GitHub Actions Secret：${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: 使用 Unity 构建
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2 # v4.8.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # 本地是中国版 2022.3.62f3c1；GameCI 使用同系列全球版，项目未引用中国版专属 API。
          unityVersion: 2022.3.62f1
          targetPlatform: ${{ inputs.target_platform }}
          androidExportType: androidPackage
          # 仓库当前仍有既存内容校验错误；云端先产出测试包，本地普通构建继续严格校验。
          customParameters: -skipFlatWorldContentValidation

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FlatWorld-${{ inputs.target_platform }}
          path: build
          if-no-files-found: error
          retention-days: 3
