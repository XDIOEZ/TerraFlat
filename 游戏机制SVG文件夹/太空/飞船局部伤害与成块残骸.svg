<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="910" viewBox="0 0 1280 910"><title>飞船局部伤害与成块残骸</title><desc>每个部件独立耐久，设备停工与结构摧毁分开；长船腰部被毁后保留能驾驶的船首，尾部残骸可以继续分裂。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8ba4be"/></marker><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#ecf2f8} .label{font-size:19px} .muted{fill:#b0c1d5;font-size:17px} .h{font-size:24px;font-weight:700} .small{font-size:15px}</style></defs><rect width="1280" height="910" rx="22" fill="#102035"/>
<text x="36" y="48" class="h">飞船局部伤害与成块残骸</text>
<text x="36" y="78" class="muted">一个连接整体共用运动刚体；碰撞占地合并；每个部件各自保存血量与状态。</text>
<rect x="30" y="105" width="1220" height="302" rx="10" fill="#1b3048" stroke="#3a5672" stroke-width="2"/>
<text x="53" y="143" class="h">集中攻击长船腰部：先打墙，再打下面的地板</text>
<rect x="72" y="174" width="58" height="57" rx="3" fill="#284b66" stroke="#8aa1bb" stroke-width="2"/>
<text x="101" y="208" class="small" text-anchor="middle">控制台</text>
<rect x="134" y="174" width="58" height="57" rx="3" fill="#284b66" stroke="#8aa1bb" stroke-width="2"/>
<text x="163" y="208" class="small" text-anchor="middle">引擎</text>
<rect x="196" y="174" width="58" height="57" rx="3" fill="#284b66" stroke="#8aa1bb" stroke-width="2"/>
<rect x="258" y="174" width="58" height="57" rx="3" fill="#284b66" stroke="#8aa1bb" stroke-width="2"/>
<rect x="320" y="174" width="58" height="57" rx="3" fill="#284b66" stroke="#8aa1bb" stroke-width="2"/>
<text x="349" y="208" class="small" text-anchor="middle">腰部墙</text>
<rect x="382" y="174" width="58" height="57" rx="3" fill="#284b66" stroke="#8aa1bb" stroke-width="2"/>
<rect x="444" y="174" width="58" height="57" rx="3" fill="#284b66" stroke="#8aa1bb" stroke-width="2"/>
<rect x="506" y="174" width="58" height="57" rx="3" fill="#284b66" stroke="#8aa1bb" stroke-width="2"/>
<text x="535" y="208" class="small" text-anchor="middle">货物</text>
<rect x="568" y="174" width="58" height="57" rx="3" fill="#284b66" stroke="#8aa1bb" stroke-width="2"/>
<text x="72" y="258" class="muted">完整船：一整块运动，贴图仍按部件画。</text>
<path d="M356 236L356 292" fill="none" stroke="#8ba4be" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="72" y="307" width="58" height="57" rx="3" fill="#286252" stroke="#8aa1bb" stroke-width="2"/>
<text x="101" y="341" class="small" text-anchor="middle">控制台</text>
<rect x="134" y="307" width="58" height="57" rx="3" fill="#286252" stroke="#8aa1bb" stroke-width="2"/>
<text x="163" y="341" class="small" text-anchor="middle">引擎</text>
<rect x="196" y="307" width="58" height="57" rx="3" fill="#286252" stroke="#8aa1bb" stroke-width="2"/>
<rect x="258" y="307" width="58" height="57" rx="3" fill="#286252" stroke="#8aa1bb" stroke-width="2"/>
<rect x="394" y="307" width="58" height="57" rx="3" fill="#375883" stroke="#8aa1bb" stroke-width="2"/>
<rect x="456" y="307" width="58" height="57" rx="3" fill="#375883" stroke="#8aa1bb" stroke-width="2"/>
<rect x="518" y="307" width="58" height="57" rx="3" fill="#375883" stroke="#8aa1bb" stroke-width="2"/>
<text x="547" y="341" class="small" text-anchor="middle">货物</text>
<rect x="580" y="307" width="58" height="57" rx="3" fill="#375883" stroke="#8aa1bb" stroke-width="2"/>
<path d="M337 302L360 325L337 348L360 371" stroke="#f1756d" stroke-width="5" fill="none"/>
<text x="72" y="389" class="small">船首保留可用控制台和引擎 → 继续作为飞船</text>
<text x="735" y="190" class="label">墙被毁的这一发，只伤害墙。</text>
<text x="735" y="224" class="label">下一发才有机会打到下面的地板。</text>
<text x="735" y="258" class="label">地板四邻连接真正断开，才拆成两块。</text>
<text x="735" y="310" class="label">船尾：一个残骸 Item + 整块运动与碰撞</text>
<text x="735" y="347" class="label">继续攻击船尾某个部位，还能拆成更小块。</text>
<text x="735" y="381" class="muted">分裂直接保留每个部件的耐久和库存。</text>
<rect x="30" y="428" width="600" height="260" rx="10" fill="#1b3048" stroke="#3a5672" stroke-width="2"/>
<rect x="649" y="428" width="601" height="260" rx="10" fill="#1b3048" stroke="#3a5672" stroke-width="2"/>
<text x="53" y="469" class="h">引擎弱点：防御 1，瘫痪耐久 20</text>
<text x="53" y="505" class="label">炮弹 20 → 实际伤害 19</text>
<text x="53" y="542" class="label">结构耐久：240 → 221 → 202</text>
<text x="53" y="579" class="label">瘫痪耐久： 20 → 1 → -18</text>
<text x="53" y="620" class="muted">瘫痪只停工，仍保留结构和碰撞。</text>
<text x="53" y="653" class="muted">结构耐久耗尽，才移除该部件。</text>
<text x="672" y="469" class="h">冲击 / 爆炸：先分预算，再扣防御</text>
<text x="672" y="505" class="label">100 点原始伤害，损伤线经过 10 个部件</text>
<text x="672" y="542" class="label">每个部件先分到 10 点</text>
<text x="672" y="579" class="label">舱壁防御 10 → 0；地板 / 引擎防御 1 → 9</text>
<text x="672" y="620" class="muted">伤害只给线经过的部件，线外保持原耐久。</text>
<text x="672" y="653" class="muted">名单先冻结，部件被毁后也不重新放大预算。</text>
<rect x="30" y="710" width="1220" height="163" rx="10" fill="#1b3048" stroke="#3a5672" stroke-width="2"/>
<text x="53" y="751" class="h">残骸再次分裂：局部伤害规则继续有效</text>
<rect x="65" y="784" width="58" height="57" rx="3" fill="#375883" stroke="#8aa1bb" stroke-width="2"/>
<rect x="127" y="784" width="58" height="57" rx="3" fill="#375883" stroke="#8aa1bb" stroke-width="2"/>
<rect x="189" y="784" width="58" height="57" rx="3" fill="#375883" stroke="#8aa1bb" stroke-width="2"/>
<text x="218" y="818" class="small" text-anchor="middle">货物</text>
<rect x="251" y="784" width="58" height="57" rx="3" fill="#375883" stroke="#8aa1bb" stroke-width="2"/>
<path d="M336 813L411 813" fill="none" stroke="#8ba4be" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="445" y="784" width="58" height="57" rx="3" fill="#375883" stroke="#8aa1bb" stroke-width="2"/>
<rect x="507" y="784" width="58" height="57" rx="3" fill="#375883" stroke="#8aa1bb" stroke-width="2"/>
<path d="M588 783L605 808L588 836" stroke="#f1756d" stroke-width="4" fill="none"/>
<rect x="635" y="784" width="58" height="57" rx="3" fill="#76613d" stroke="#8aa1bb" stroke-width="2"/>
<text x="664" y="818" class="small" text-anchor="middle">货物</text>
<text x="744" y="801" class="label">毁掉中间地板 → 两块独立残骸</text>
<text x="744" y="836" class="muted">每块仍是一个 Item，内部血量映射继续保留。</text>
<text x="33" y="898" class="small">规则已实现；示意图解释机制，实际画面、操控、性能及多人效果由用户验收。</text>
</svg>
