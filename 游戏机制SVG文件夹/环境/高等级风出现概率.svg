<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc">
  <title id="title">自然天气统一减少至30%，强风保留额外抑制</title>
  <desc id="desc">所有自然天气事件的基础概率统一乘0.3，包括风、雨、雪、雷。八级、九级、十级强风另保留0.5、0.25、0.1倍率，相对当地基础概率分别为15%、7.5%、3%。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142333"/><stop offset="1" stop-color="#0c1420"/></linearGradient></defs>
  <rect width="1040" height="610" rx="24" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, sans-serif" fill="#eaf2fa">
    <text x="46" y="58" font-size="29" font-weight="700">自然天气更少出现，强风保留额外抑制</text>
    <text x="46" y="96" font-size="17" fill="#9cb1c6">所有自然天气统一乘 0.3 · 以下将各自当地基础概率当作 100% 来比较</text>
    <rect x="710" y="120" width="20" height="12" fill="#40566b"/><text x="740" y="133" font-size="16" fill="#9cb1c6">原来</text>
    <rect x="810" y="120" width="20" height="12" fill="#64e0c4"/><text x="840" y="133" font-size="16" fill="#9cb1c6">调整后</text>
    <g font-size="21">
      <text x="46" y="181" font-size="18">普通风 / 雨雪 / 雷</text>
      <rect x="218" y="157" width="550" height="13" rx="4" fill="#40566b"/>
      <rect x="218" y="177" width="165" height="20" rx="4" fill="#64e0c4"/>
      <text x="405" y="195" fill="#64e0c4">30% · 原概率 × 0.3</text>
      <text x="46" y="257">8 级</text>
      <rect x="218" y="233" width="550" height="13" rx="4" fill="#40566b"/>
      <rect x="218" y="253" width="82.5" height="20" rx="4" fill="#64e0c4"/>
      <text x="323" y="271" fill="#64e0c4">15% · 0.3 × 0.5</text>
      <text x="46" y="333">9 级</text>
      <rect x="218" y="309" width="550" height="13" rx="4" fill="#40566b"/>
      <rect x="218" y="329" width="41.25" height="20" rx="4" fill="#64e0c4"/>
      <text x="281" y="347" fill="#64e0c4">7.5% · 0.3 × 0.25</text>
      <text x="46" y="409">10 级</text>
      <rect x="218" y="385" width="550" height="13" rx="4" fill="#40566b"/>
      <rect x="218" y="405" width="16.5" height="20" rx="4" fill="#64e0c4"/>
      <text x="257" y="423" fill="#64e0c4">3% · 0.3 × 0.1</text>
    </g>
    <rect x="46" y="458" width="948" height="63" rx="12" fill="#233648"/>
    <text x="68" y="497" font-size="22">新出现概率 = 当地基础概率 × 0.3 × 原有要素倍率</text>
    <text x="46" y="554" font-size="17" fill="#9cb1c6">目标是让晴天成为常态、天气成为特殊状态；这些比例不是实际游玩时间占比。</text>
    <text x="46" y="586" font-size="16" fill="#9cb1c6">强度、持续时间与手动天气保留；配置：regional-weather.json；实际频率由用户验收。</text>
  </g>
</svg>
