<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#97acc8"/></marker>
    <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#eaf0fa}.title{font-size:30px;font-weight:bold}.label{font-size:22px;font-weight:bold}.body{font-size:20px}.small{font-size:17px}.muted{fill:#b3c4dc}.box{fill:#1a2d47;stroke:#45668c;stroke-width:1.5}.arrow{stroke:#97acc8;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="720" rx="18" fill="#101d30"/>
  <text x="35" y="50" class="title">雨天地表补水：规则照常计算，重复工作按区块合并</text>
  <text x="35" y="85" class="small muted">这轮修改执行方式；吸水量、容量、雨雪分流、融雪与天气推进间隔沿用原规则。</text>
  <rect x="35" y="109" width="1130" height="126" rx="12" class="box"/>
  <text x="55" y="145" class="label">以前：每格完整查目录 / 查场景和环绕边界 / 写环境层 / 广播 / 更新显示</text>
  <text x="55" y="182" class="body">示例：1,000 格水量和湿度变化 → 约 2,000 次变化广播，所有观察者反复过滤。</text>
  <text x="55" y="214" class="small muted">旧 Profiler 记录曾出现 25,203 次补水、约 343 ms；没有在本轮运行中测量优化后的耗时。</text>
  <text x="35" y="275" class="label">现在：每块复用一次数据，先完成真值，再统一通知</text>
  <rect x="35" y="302" width="250" height="150" rx="12" class="box"/>
  <text x="53" y="337" class="label">1. 收集与计算</text>
  <text x="53" y="374" class="body">共享水肥数组与目录</text>
  <text x="53" y="408" class="small muted">满水格提前跳过</text>
  <text x="53" y="435" class="small muted">已规范坐标直接查占地</text>
  <path d="M294 377 L319 377" class="arrow"/>
  <rect x="328" y="302" width="250" height="150" rx="12" class="box"/>
  <text x="346" y="337" class="label">2. 各层批量写回</text>
  <text x="346" y="374" class="body">只记录真实变化格</text>
  <text x="346" y="408" class="small muted">每层变化只递增一次版本</text>
  <text x="346" y="435" class="small muted">此时全部水肥数据已一致</text>
  <path d="M587 377 L612 377" class="arrow"/>
  <rect x="621" y="302" width="250" height="150" rx="12" class="box"/>
  <text x="639" y="337" class="label">3. 记录真实变化</text>
  <text x="639" y="374" class="body">保存 / 权威差量</text>
  <text x="639" y="408" class="small muted">先记真值，再发显示通知</text>
  <text x="639" y="435" class="small muted">避免显示报错导致漏保存</text>
  <path d="M880 377 L905 377" class="arrow"/>
  <rect x="914" y="302" width="251" height="150" rx="12" fill="#1f423d" stroke="#558c7c"/>
  <text x="932" y="337" class="label">4. 每层通知一次</text>
  <text x="932" y="374" class="body">无关观察者只过滤一次</text>
  <text x="932" y="408" class="small muted">湿地外观相同不再提交</text>
  <text x="932" y="435" class="small muted">真变的显示合并上传</text>
  <rect x="35" y="479" width="1130" height="96" rx="12" fill="#24433b"/>
  <text x="55" y="517" class="label">同样 1,000 格水量和湿度变化 → 2 次广播；首次建土壤状态时每块最多 5 层。</text>
  <text x="55" y="553" class="body">所有该补水的格子仍被计算。次数减少来自合并，不能据此直接声称帧率提高多少。</text>
  <text x="35" y="614" class="label">后续分析器可以展开四段：Prepare → Compute → Write → Notify</text>
  <text x="35" y="651" class="small muted">规则回归覆盖容量与拒绝、批量数值、通知索引、非法批次、版本、异常重试；真实雨天由用户验收。</text>
  <text x="35" y="686" class="small muted">索引 / 数组只借用于同步阶段；发布失败保留未发批次；地表土壤变化不使液体热缓存失效。</text>
</svg>
