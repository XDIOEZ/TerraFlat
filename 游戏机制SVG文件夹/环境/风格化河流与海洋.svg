<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660">
  <defs>
    <style>
      text {font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#e6f0fa}
      .title {font-size:29px;font-weight:700}
      .heading {font-size:23px;font-weight:700}
      .body {font-size:18px}
      .note {font-size:16px;fill:#a7c6df}
      .glint {stroke:#72a4bf;stroke-width:2;stroke-linecap:round;opacity:.65}
    </style>
    <clipPath id="river"><rect x="45" y="200" width="450" height="190" rx="14"/></clipPath>
    <clipPath id="ocean"><rect x="545" y="200" width="450" height="190" rx="14"/></clipPath>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#8bb4ce" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1040" height="660" rx="22" fill="#102132"/>
  <text x="40" y="55" class="title">风格化河流与海洋，使用同一套水面观感</text>
  <text x="40" y="87" class="note">本轮接入示意 · 深浅色带 + 稀疏短亮纹 · 具体画面由玩家验收</text>
  <rect x="40" y="110" width="960" height="55" rx="13" fill="#253e53"/>
  <text x="62" y="145" class="heading">设置 → 视觉特效 → 水体风格 → 风格化</text>
  <text x="40" y="192" class="heading">河流：保留你喜欢的效果</text>
  <text x="540" y="192" class="heading">海洋：新增对应的风格化效果</text>
  <g clip-path="url(#river)">
    <rect x="45" y="200" width="450" height="190" fill="#446780"/>
    <path d="M20 222 L530 359" stroke="#35546c" stroke-width="108"/>
    <path d="M20 222 L530 359" stroke="#29435e" stroke-width="66"/>
    <path d="M20 222 L530 359" stroke="#1b334f" stroke-width="27"/>
    <g class="glint">
      <path d="M89 268 l12 4 M144 243 l6 2 M176 315 l16 4 M263 280 l9 3 M301 345 l12 3 M389 317 l8 2 M447 372 l6 2"/>
      <path d="M73 321 l8 2 M234 354 l11 3 M341 293 l7 2 M413 351 l12 3"/>
    </g>
  </g>
  <g clip-path="url(#ocean)">
    <rect x="545" y="200" width="450" height="190" fill="#1b334f"/>
    <path d="M518 226 L629 220 L677 239 L733 236 L789 254 L851 246 L1009 273" fill="none" stroke="#29435e" stroke-width="83"/>
    <path d="M518 214 L629 208 L677 227 L733 224 L789 242 L851 234 L1009 261" fill="none" stroke="#35546c" stroke-width="55"/>
    <path d="M518 205 L629 199 L677 218 L733 215 L789 233 L851 225 L1009 252" fill="none" stroke="#446780" stroke-width="25"/>
    <g class="glint">
      <path d="M576 290 l12 4 M617 330 l7 2 M693 269 l10 3 M748 356 l12 3 M827 293 l8 2 M902 346 l13 4 M970 311 l9 3"/>
      <path d="M575 364 l8 2 M716 319 l7 2 M861 369 l11 3 M943 283 l9 2"/>
    </g>
  </g>
  <text x="52" y="420" class="body">真实流向 / 流速带动短亮纹</text>
  <text x="552" y="420" class="body">海风 / 浪高 / 潮汐带动短亮纹</text>
  <path d="M268 435 L268 458 L772 458 L772 435" fill="none" stroke="#8bb4ce" stroke-width="2"/>
  <path d="M520 458 L520 482" stroke="#8bb4ce" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="490" width="960" height="92" rx="15" fill="#233d50"/>
  <text x="62" y="524" class="heading">三种海洋风格都去掉：扭曲闭环水纹、网状焦散</text>
  <text x="62" y="556" class="body">保留真实水深颜色、方向与速度、反光、稀疏白沫、岸线和月光</text>
  <text x="40" y="620" class="note">图中仅展示表现关系；海洋和河流的玩法数据仍各自独立，切换风格只改变外观。</text>
</svg>
