<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360">
  <title>世界电池三格电量显示</title>
  <desc>电池根据实际储能从左到右点亮三个绿色格子，门槛分别为33%、66%、99%。下降到门槛以下时熄灭对应格，靠近打开面板查看精确数值。</desc>
  <defs>
    <g id="battery">
      <rect x="19" y="-13" width="28" height="23" fill="#713e28" stroke="#17171c" stroke-width="4"/>
      <rect x="143" y="-13" width="28" height="23" fill="#4c4a50" stroke="#17171c" stroke-width="4"/>
      <rect width="190" height="116" rx="5" fill="#171b26" stroke="#68422e" stroke-width="9"/>
      <rect x="56" y="8" width="78" height="27" fill="#0b0d13" stroke="#65402c" stroke-width="5"/>
      <g fill="#2f3437">
        <rect x="63" y="14" width="15" height="15"/>
        <rect x="87" y="14" width="15" height="15"/>
        <rect x="111" y="14" width="15" height="15"/>
      </g>
      <g fill="#0e1420" stroke="#252b38" stroke-width="3">
        <rect x="16" y="45" width="43" height="57" rx="3"/>
        <rect x="74" y="45" width="43" height="57" rx="3"/>
        <rect x="132" y="45" width="43" height="57" rx="3"/>
      </g>
    </g>
  </defs>
  <rect width="940" height="360" rx="14" fill="#172331"/>
  <g font-family="Microsoft YaHei, sans-serif" fill="#edf1f5">
    <text x="32" y="44" font-size="25">世界电池：每满 33% 电量，亮一格</text>
    <text x="32" y="75" font-size="16" fill="#b9c8d7">读真实储能，从左到右显示；电量下降时按相同门槛熄灭。</text>
    <g transform="translate(40 119)">
      <use href="#battery"/>
      <text x="95" y="155" text-anchor="middle" font-size="22">20%</text>
      <text x="95" y="183" text-anchor="middle" font-size="16" fill="#b9c8d7">低于 33% · 全暗</text>
    </g>
    <g transform="translate(263 119)">
      <use href="#battery"/>
      <rect x="63" y="14" width="15" height="15" fill="#1fd948"/>
      <text x="95" y="155" text-anchor="middle" font-size="22">50%</text>
      <text x="95" y="183" text-anchor="middle" font-size="16" fill="#b9c8d7">达到 33% · 亮一格</text>
    </g>
    <g transform="translate(486 119)">
      <use href="#battery"/>
      <g fill="#1fd948"><rect x="63" y="14" width="15" height="15"/><rect x="87" y="14" width="15" height="15"/></g>
      <text x="95" y="155" text-anchor="middle" font-size="22">80%</text>
      <text x="95" y="183" text-anchor="middle" font-size="16" fill="#b9c8d7">达到 66% · 亮两格</text>
    </g>
    <g transform="translate(709 119)">
      <use href="#battery"/>
      <g fill="#1fd948"><rect x="63" y="14" width="15" height="15"/><rect x="87" y="14" width="15" height="15"/><rect x="111" y="14" width="15" height="15"/></g>
      <text x="95" y="155" text-anchor="middle" font-size="22">100%</text>
      <text x="95" y="183" text-anchor="middle" font-size="16" fill="#b9c8d7">达到 99% · 亮三格</text>
    </g>
    <text x="470" y="335" text-anchor="middle" font-size="16" fill="#dfd094">地面和船上的电池共用规则；精确电量靠近后打开面板查看。此图为机制示意。</text>
  </g>
</svg>
